name: news
# Saatte bir Forex Factory takvimi (daha sık değil — engellenebilir). FMP_KEY varsa gerçek değerler.
# Tarama penceresinde (07–16 UTC) haber tarama döngüsü içinde çekilir; bu iş sadece pencere dışında çalışır.
on:
  schedule:
    - cron: '7 0-4,17-23 * * *'
    - cron: '7 5-6 * * 0,6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-branch
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_DIR: ${{ github.workspace }}/data-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: scanner
      - run: bash scripts/data-branch.sh pull
      - name: Haber
        working-directory: scanner
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}
        run: npm run news
      - run: bash scripts/data-branch.sh push "haber"
