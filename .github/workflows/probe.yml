name: probe (geçici)
on:
  push:
    branches: [ccr-52842625-mn31wy]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: eToro uç nokta ayrıntıları
        run: |
          curl -sL -m 25 https://api-portal.etoro.com/llms.txt -o llms.txt
          grep -iE "rankings|user-stats|users-info|pi-data|instrument|market-data/search|terms|gain" llms.txt | sed -E 's/\): .*/)/' | head -60
          for u in $(grep -ioE "https://api-portal.etoro.com/api-reference/(rankings|user-stats|users-info|pi-data)/[a-z0-9-]+\.md" llms.txt | sort -u) $(grep -ioE "https://api-portal.etoro.com/[a-z/-]*(instrument|terms)[a-z/-]*\.md" llms.txt | sort -u); do
            echo "=================== $u"
            curl -sL -m 25 "$u" -o p.md
            python3 - <<'EOF'
          import re
          s = open('p.md', encoding='utf-8').read()
          i = s.find('paths:')
          body = s[i:] if i >= 0 else s
          out = []
          for line in body.splitlines():
              t = line.strip()
              if re.match(r'^(/api|get:|post:|- name:|name:|in:|required:|enum:|[a-zA-Z0-9_]+:$|- [A-Za-z0-9]+$)', t) or t.startswith('/api'):
                  out.append(line[:110])
          print('\n'.join(out[:140]))
          if i < 0: print(s[:2500])
          EOF
          done
