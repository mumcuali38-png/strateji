name: probe (geçici)
on:
  push:
    branches: [ccr-52842625-mn31wy]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak erişimi 2
        run: |
          for u in \
            "https://www.okx.com/api/v5/rubik/stat/contracts/long-short-position-ratio-contract-top-trader?instId=BTC-USDT-SWAP&period=1H&limit=2" \
            "https://www.okx.com/api/v5/rubik/stat/contracts/long-short-account-ratio-contract?instId=ETH-USDT-SWAP&period=1H&limit=2" \
            "https://www.okx.com/api/v5/rubik/stat/contracts/open-interest-history?instId=ETH-USDT-SWAP&period=1H&limit=2" ; do
            echo "== $u"; curl -s -m 20 -A "Mozilla/5.0" -w "\nHTTP %{http_code}\n" "$u" | head -c 700; echo
          done
          curl -s -m 20 -A "Mozilla/5.0" -o b.html https://farside.co.uk/btc/
          python3 - <<'EOF'
          import re
          s = open('b.html', encoding='utf-8', errors='ignore').read()
          i = s.find('<table')
          print('tables', s.count('<table'), 'first at', i)
          for m in re.finditer(r'<table', s):
              print('---- table at', m.start()); print(re.sub(r'\s+', ' ', s[m.start():m.start()+1500])); print()
          rows = re.findall(r'<tr[^>]*>(.*?)</tr>', s, re.S)
          print('rows', len(rows))
          for r in rows[-8:]:
              cells = [re.sub(r'<[^>]+>', '', c).strip() for c in re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', r, re.S)]
              print(cells)
          EOF
