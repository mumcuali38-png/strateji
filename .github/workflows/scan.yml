name: scan
# Tarama penceresi 10:00–20:00 TR (07:00–16:55 UTC). GitHub zamanlanmış görevleri geciktirebildiği için
# tetiklenen iş pencere boyunca kendi içinde 5 dk'da bir tarar (scripts/scan-loop.sh); tetikler döngüyü devam ettirir.
on:
  schedule:
    - cron: '*/5 7-16 * * *'
    - cron: '*/5 5-6 * * 1-5' # ön pencere 08:00–10:00 TR (sadece XAU / Kurulum G)
    - cron: '17 6 1 * *' # aylık keepalive (60 gün hareketsizlikte durmasın)
  workflow_dispatch:
    inputs:
      force:
        description: 'Tarama penceresi dışında da çalıştır'
        type: boolean
        default: true
      push_test:
        description: 'Test bildirimi gönder'
        type: boolean
        default: false
      wait:
        description: 'Pencere açılana kadar bekle (scan-f önceden tetikler)'
        type: boolean
        default: false
      backtest:
        description: 'Son 10 iş günü geriye dönük kuru çalıştırma (backtest.md)'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: data-branch
  cancel-in-progress: false
jobs:
  keepalive:
    if: github.event.schedule == '17 6 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: İş akışlarını etkin tut
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in scan.yml scan-f.yml news.yml deploy.yml; do gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" || true; done
  scan:
    if: github.event.schedule != '17 6 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_DIR: ${{ github.workspace }}/data-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: scanner
      - name: data dalını al
        run: bash scripts/data-branch.sh pull
      - name: Tarama döngüsü (5 dk'da bir, pencere kapanana kadar)
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          FORCE_FIRST: ${{ inputs.force && '1' || '0' }}
          PUSH_TEST: ${{ inputs.push_test && '1' || '0' }}
          LOOP_MAX_MIN: '330'
          WAIT_MAX_MIN: ${{ inputs.wait && '160' || '0' }}
        run: bash scripts/scan-loop.sh
      - name: Geriye dönük kuru çalıştırma
        if: inputs.backtest
        working-directory: scanner
        run: npm run backtest -- 10
      - name: data dalına yaz
        if: inputs.backtest
        run: bash scripts/data-branch.sh push "backtest"
